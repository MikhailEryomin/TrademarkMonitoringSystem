<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Товарных Знаков</title>
    <!-- Подключаем Bootstrap 5 для красоты -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1200px; margin-top: 50px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge-violation { background-color: #dc3545; } /* Красный */
        .badge-legal { background-color: #198754; }    /* Зеленый */
        .badge-parking { background-color: #ffc107; color: #000; } /* Желтый */
        .badge-suspicious { background-color: #fd7e14; } /* Оранжевый */
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-center">Система выявления нарушений ТЗ</h2>

    <!-- Панель управления -->
    <div class="card p-4 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-auto">
                <label for="tmInput" class="col-form-label fw-bold">Номер Товарного Знака (ФИПС):</label>
            </div>
            <div class="col-auto">
                <input type="text" id="tmInput" class="form-control" placeholder="Например: 762980" value="762980">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="startScan()">1. Запустить сканирование</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-success" onclick="loadResults()">2. Обновить результаты</button>
            </div>
        </div>
        <div id="alertBox" class="mt-3"></div>
    </div>

    <!-- Таблица результатов -->
    <div class="card p-4">
        <h5 class="mb-3">Результаты сканирования</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Домен</th>
                        <th>URL</th>
                        <th>Категория</th>
                        <th>Уверенность (ML)</th>
                        <th>Сходство (Левенштейн)</th>
                        <th>Дата сканирования</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <tr><td colspan="7" class="text-center text-muted">Введите номер ТЗ и нажмите "Обновить результаты"</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = "http://localhost:8000/api";

    // Функция для вывода уведомлений
    function showAlert(message, type = 'info') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                                ${message}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                              </div>`;
    }

    // 1. Запуск сканирования (POST)
    async function startScan() {
        const tmNumber = document.getElementById('tmInput').value.trim();
        if (!tmNumber) {
            showAlert("Введите номер товарного знака!", "warning");
            return;
        }

        showAlert(`Запускаем фоновый поиск для ТЗ ${tmNumber}. Это займет несколько минут...`, "primary");

        try {
            const response = await fetch(`${API_BASE_URL}/scan/${tmNumber}`, { method: 'POST' });
            const data = await response.json();

            if (response.ok) {
                showAlert(`✅ ${data.message} Нажмите "Обновить результаты" через минуту.`, "success");
            } else {
                showAlert(`❌ Ошибка: ${data.detail || 'Неизвестная ошибка'}`, "danger");
            }
        } catch (error) {
            showAlert(`❌ Ошибка сети: ${error.message}`, "danger");
        }
    }

    // 2. Получение результатов (GET)
    async function loadResults() {
        const tmNumber = document.getElementById('tmInput').value.trim();
        if (!tmNumber) return;

        const tbody = document.getElementById('resultsTableBody');
        tbody.innerHTML = `<tr><td colspan="7" class="text-center"><div class="spinner-border text-primary" role="status"></div> Загрузка...</td></tr>`;

        try {
            const response = await fetch(`${API_BASE_URL}/results/${tmNumber}`);

            if (response.status === 404) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Товарный знак не найден в базе. Сначала запустите сканирование.</td></tr>`;
                return;
            }

            const data = await response.json();

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Сайты пока не найдены. Возможно, сканирование еще идет.</td></tr>`;
                return;
            }

            // Отрисовка таблицы
            tbody.innerHTML = "";
            data.forEach(item => {
                // Выбираем цвет бейджика
                let badgeClass = 'bg-secondary';
                if (item.predicted_category === 'Нарушение') badgeClass = 'badge-violation';
                if (item.predicted_category === 'Легальный') badgeClass = 'badge-legal';
                if (item.predicted_category === 'Парковка') badgeClass = 'badge-parking';
                if (item.predicted_category === 'Подозрительный') badgeClass = 'badge-suspicious';

                // Форматируем уверенность в проценты
                const confidenceStr = item.confidence ? `${(item.confidence * 100).toFixed(0)}%` : 'N/A';
                const simStr = item.domain_similarity ? item.domain_similarity.toFixed(2) : 'N/A';
                const dateStr = new Date(item.scan_date).toLocaleString('ru-RU');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td class="fw-bold">${item.domain_name}</td>
                    <td><a href="${item.url}" target="_blank" class="text-decoration-none">${item.url}</a></td>
                    <td><span class="badge ${badgeClass} fs-6">${item.predicted_category}</span></td>
                    <td>${confidenceStr}</td>
                    <td>${simStr}</td>
                    <td class="text-muted small">${dateStr}</td>
                `;
                tbody.appendChild(tr);
            });

        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Ошибка сети: ${error.message}</td></tr>`;
        }
    }
</script>
<!-- Подключаем скрипты Bootstrap для работы закрытия уведомлений -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
